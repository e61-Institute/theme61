on:
  pull_request:
    types: [closed]
    branches: [dev]

name: Close issues on merge to dev

# Closes an issue as soon as its fix lands in dev, based on closing keywords
# (closes/fixes/resolves #N) in the commit messages the merged PR introduced.
# This tracks engineering completion, not release status: closing here just
# means the fix exists in dev, not that it has shipped to users yet. Any
# milestone already on the issue (e.g. v0.9.0) is left alone -- it still
# tracks which release the fix is waiting on, and gets closed out by
# close-milestone-on-release.yaml once that version actually reaches main.
permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Read commit messages via the API rather than local git history:
            // dev accepts direct pushes/resets, which can make a PR's base
            // sha unreachable and break a `git log base..head` diff entirely.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const log = commits.map(c => c.commit.message).join('\n');

            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = new Set();
            let m;
            while ((m = re.exec(log))) numbers.add(Number(m[1]));

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number,
                });
                if (issue.state === 'closed') continue;

                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number,
                  state: 'closed', state_reason: 'completed',
                });

                const milestoneNote = issue.milestone
                  ? ` Tracked under milestone **${issue.milestone.title}**, which closes once that version is released to main.`
                  : '';
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number,
                  body: `Fix merged to \`dev\` in #${context.payload.pull_request.number}.${milestoneNote}`,
                });
              } catch (e) {
                core.warning(`Issue #${issue_number}: ${e.message}`);
              }
            }
